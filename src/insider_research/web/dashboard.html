<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Insider Research · Monthly coverage</title>
<style>
:root{font-family:Segoe UI,system-ui,sans-serif;color:#223d32;background:#f7f8f5;font-size:14px}*{box-sizing:border-box}body{margin:0}header{height:76px;background:#203e31;color:#fff;display:flex;align-items:center;padding:0 36px;font-weight:650;font-size:18px;letter-spacing:-.3px}header span{opacity:.55;margin-right:12px}main{max-width:1600px;margin:0 auto;padding:42px 24px}section{background:#fff;border:1px solid #e0e5dc;border-radius:12px;padding:26px 28px 22px}h1{font-size:19px;letter-spacing:-.4px;font-weight:600;margin:0}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px}.range{font-size:12px;color:#7c897f}.scroll{overflow-x:auto;padding:5px 1px 8px}.timeline{display:grid;grid-auto-flow:column;grid-auto-columns:8px;gap:3px;width:max-content;min-width:100%;height:100px;align-items:end}.bar{border:0;border-radius:1px;padding:0;min-width:0;cursor:default;background:#e15d56;position:relative}.bar.unindexed{background:#bdc4c0}.bar.complete{background:#16b77f}.bar.partial{background:#e9ad43}.bar:hover,.bar:focus-visible{outline:2px solid #263e33;outline-offset:2px;z-index:1}.axis{position:relative;height:16px;margin-top:9px;width:100%;color:#8a948b;font-size:10px}.axis span{position:absolute;transform:translateX(-50%)}.axis span:first-child{transform:none}.axis span:last-child{transform:translateX(-100%)}.legend{display:flex;gap:20px;align-items:center;margin-top:16px;color:#819084;font-size:11px}.legend span{display:flex;gap:6px;align-items:center}.dot{width:6px;height:6px;border-radius:50%;background:#e15d56;display:inline-block}.dot.partial{background:linear-gradient(to top,#16b77f 50%,#e15d56 50%)}.dot.unindexed{background:#bdc4c0}.dot.complete{background:#16b77f}#tooltip{position:fixed;z-index:5;background:#203e31;color:#fff;padding:16px 18px;border-radius:9px;box-shadow:0 8px 30px #203e3129;width:265px;pointer-events:none;font-size:12px}#tooltip[hidden]{display:none}.month{font-weight:600;font-size:14px;margin-bottom:12px}.detail{display:flex;justify-content:space-between;gap:15px;margin-top:7px}.detail span:first-child{color:#b9c9bc}.tipnote{color:#b9c9bc;font-size:11px;line-height:1.5;margin-top:12px;border-top:1px solid #ffffff20;padding-top:10px}.error{color:#9a5146;font-size:12px;line-height:1.5;margin-top:14px}.error:empty{display:none}.loading{opacity:.5}button:focus-visible{outline:2px solid #263e33}@media(max-width:600px){header{height:65px;padding:0 22px}main{padding:26px 16px}section{padding:20px 18px}.topline{align-items:start;flex-direction:column;gap:7px;margin-bottom:20px}.legend{gap:13px;flex-wrap:wrap}}
.freshness{margin-top:18px;display:flex;justify-content:space-between;gap:24px;padding:20px 28px}.freshness h2{margin:0 0 8px;font-size:12px;font-weight:500;color:#7c897f}.freshness time{font-size:14px;font-weight:550}.freshness p{margin:7px 0 0;font-size:11px;color:#7c897f}.viewFreshness{text-align:right}@media(max-width:600px){.freshness{padding:18px;flex-wrap:wrap}.viewFreshness{text-align:left}.legend{flex-wrap:wrap}}
</style>
</head>
<body>
<header><span>◈</span>Insider Research</header>
<main><section aria-label="Monthly filing download coverage">
<div class="topline"><h1>Monthly coverage</h1><span id="range" class="range">July 2003 — present · Forms 3, 4 & 5</span></div>
<div class="scroll"><div id="timeline" class="timeline loading" role="group" aria-label="One bar per month; use arrow keys to explore"></div><div id="axis" class="axis" aria-hidden="true"></div></div>
<div class="legend"><span><i class="dot unindexed"></i>Not indexed</span><span><i class="dot"></i>No files</span><span><i class="dot partial"></i>Partial</span><span><i class="dot complete"></i>Complete</span><span>Height = indexed filings</span></div>
<div id="error" class="error" role="alert"></div>
</section><section class="freshness" aria-label="Index freshness"><div><h2>Last indexed</h2><time id="lastIndexed">Loading…</time><p id="indexedSource"></p></div><div class="viewFreshness"><h2>View refreshed</h2><time id="viewRefreshed">Waiting for data…</time></div></section></main>
<div id="tooltip" role="tooltip" hidden></div>
<script>
const timeline=document.getElementById('timeline'),axis=document.getElementById('axis'),tooltip=document.getElementById('tooltip'),error=document.getElementById('error');
const stamp=value=>new Intl.DateTimeFormat('en-GB',{dateStyle:'medium',timeStyle:'medium',timeZone:'Europe/London'}).format(new Date(value))+' · London';
const fmt=n=>Number(n).toLocaleString(),monthName=key=>new Date(key+'-01T12:00:00Z').toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'});
let months=[],activeKey=null,buttons=[],initial=true;
function textRow(label,value){const row=document.createElement('div');row.className='detail';const name=document.createElement('span'),count=document.createElement('span');name.textContent=label;count.textContent=value;row.append(name,count);return row;}
function show(key,anchor){const month=months.find(item=>item.month===key);if(!month)return;activeKey=key;tooltip.replaceChildren();const title=document.createElement('div');title.className='month';title.textContent=monthName(key);tooltip.append(title,textRow('Downloaded',fmt(month.downloaded)),textRow('Indexed',fmt(month.indexed)),textRow('Expected total',month.expected===null?'Unknown':fmt(month.expected)));
if(month.expected!==null)tooltip.append(textRow('Remaining',fmt(month.expected-month.downloaded)));
if(month.expected===null||month.expected===0){const note=document.createElement('div');note.className='tipnote';note.textContent=month.state==='unindexed'?'No index loaded for this month. The expected total is unknown.':month.open_month?'Month still in progress. Indexed counts may grow.':month.expected===null?'Full-month index not loaded. Expected count is not yet known.':'No ownership filings in the loaded index for this month.';tooltip.append(note);}
tooltip.hidden=false;const rect=anchor.getBoundingClientRect();tooltip.style.left=Math.max(10,Math.min(rect.left+rect.width/2-132,window.innerWidth-275))+'px';tooltip.style.top=Math.min(rect.bottom+14,window.innerHeight-tooltip.offsetHeight-10)+'px';}
function hide(){activeKey=null;tooltip.hidden=true;}
function render(){const peak=Math.max(1,...months.map(month=>month.indexed));const focused=document.activeElement?.dataset.month;timeline.replaceChildren();axis.replaceChildren();buttons=[];
for(const [index,month] of months.entries()){const bar=document.createElement('button');bar.type='button';bar.className='bar '+month.state;bar.dataset.month=month.month;bar.style.height=Math.max(4,100*month.indexed/peak)+'px';bar.tabIndex=(focused?month.month===focused:index===0)?0:-1;
if(month.state==='partial'&&month.expected>0){const percent=Math.max(0,Math.min(100,100*month.downloaded/month.expected));bar.style.background=`linear-gradient(to top,#16b77f 0%,#16b77f ${percent}%,#e15d56 ${percent}%,#e15d56 100%)`;}
bar.setAttribute('aria-label',`${monthName(month.month)}: ${fmt(month.downloaded)} downloaded, ${fmt(month.indexed)} indexed; expected ${month.expected===null?'unknown':fmt(month.expected)}`);bar.setAttribute('aria-describedby','tooltip');
bar.onmouseenter=()=>show(month.month,bar);bar.onmouseleave=()=>{if(document.activeElement!==bar)hide();};bar.onfocus=()=>show(month.month,bar);bar.onblur=hide;bar.onclick=()=>show(month.month,bar);
bar.onkeydown=event=>{let target=index;if(event.key==='ArrowRight')target=Math.min(index+1,months.length-1);else if(event.key==='ArrowLeft')target=Math.max(index-1,0);else if(event.key==='Home')target=0;else if(event.key==='End')target=months.length-1;else if(event.key==='Escape'){hide();return;}else return;event.preventDefault();bar.tabIndex=-1;buttons[target].tabIndex=0;buttons[target].focus();};timeline.append(bar);buttons.push(bar);}
for(const [index,month] of months.entries()){if(index===0||index===months.length-1||(index>12&&index<months.length-18&&month.month.endsWith('-01')&&Number(month.month.slice(0,4))%5===0)){const label=document.createElement('span');label.textContent=month.month.slice(0,4);label.style.left=100*(index/(months.length-1))+'%';axis.append(label);}}
axis.style.width=timeline.scrollWidth+'px';timeline.classList.remove('loading');if(initial&&months.length){const scroller=document.querySelector('.scroll');scroller.scrollLeft=scroller.scrollWidth;initial=false;}if(months.length)document.getElementById('range').textContent=monthName(months[0].month)+' — '+monthName(months.at(-1).month)+' · Forms 3, 4 & 5';if(focused)buttons.find(button=>button.dataset.month===focused)?.focus();if(activeKey){const bar=buttons.find(button=>button.dataset.month===activeKey);if(bar)show(activeKey,bar);}}
let fetching=false;async function refresh(){if(fetching)return;fetching=true;try{const response=await fetch('/api/coverage');const data=await response.json();if(!response.ok)throw Error(data.error||'Unable to load coverage');months=data.months;render();const latest=data.last_indexed;document.getElementById('lastIndexed').textContent=latest?stamp(latest.indexed_at):'Not indexed yet';document.getElementById('indexedSource').textContent=latest?`${latest.kind==='quarterly'?'Quarterly':'Daily'} index · ${latest.period}${latest.offline?' · Local import / cache replay':''}`:'';document.getElementById('viewRefreshed').textContent=stamp(new Date());error.textContent='';}catch(e){error.textContent=e.message;}finally{fetching=false;}}
function reposition(){const focused=document.activeElement;if(focused?.dataset.month)show(focused.dataset.month,focused);else hide();}window.addEventListener('resize',reposition);document.querySelector('.scroll').addEventListener('scroll',reposition);document.addEventListener('keydown',event=>{if(event.key==='Escape')hide();});refresh();setInterval(()=>{if(!document.hidden)refresh();},10000);
</script>
</body></html>
